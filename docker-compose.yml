version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: jalsathi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jalsathi
      POSTGRES_USER: jalsathi_user
      POSTGRES_PASSWORD: jalsathi_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalsathi_user -d jalsathi"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: jalsathi_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jalsathi_user:jalsathi_pass@postgres:5432/jalsathi
      JWT_SECRET: change_this_to_a_strong_secret_in_production
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: development
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules

volumes:
  pgdata:
